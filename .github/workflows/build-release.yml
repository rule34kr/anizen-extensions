name: Build and publish WebDAV extension

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'scripts/**'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdav-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout distribution repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0

      - name: Restore WebDAV source module
        shell: bash
        run: |
          set -euo pipefail
          cat payload/webdav-core.part*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/webdav-core.tar.xz"
          echo "0368eb27d17744c663af73ca3799e054dd83e94f7217db62df0bc6600289a342  $RUNNER_TEMP/webdav-core.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/webdav-core.tar.xz" -C "$GITHUB_WORKSPACE"
          test -f src/all/webdav/build.gradle

      - name: Validate signing secrets
        id: validate_signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_KEY_FINGERPRINT: ${{ secrets.SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            value="${!name}"
            [[ -n "$value" ]] || { echo "Missing secret: $name" >&2; exit 1; }
          done
          [[ "$SIGNING_KEY_FINGERPRINT" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo 'SIGNING_KEY_FINGERPRINT must be 64 hexadecimal characters.' >&2
            exit 1
          }

      - name: Checkout pinned extension build environment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: salmanbappi/sb-extensions-source
          ref: c8d9cef922353b0399ee802d5a594d1884c9be41
          path: upstream

      - name: Overlay WebDAV module
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream/src/all/webdav
          mkdir -p upstream/src/all
          cp -a src/all/webdav upstream/src/all/webdav

      - name: Patch WebDAV preference constructors
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-webdav-preferences.py upstream

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Configure Gradle distribution download retries
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          properties="gradle/wrapper/gradle-wrapper.properties"
          test -f "$properties"
          for key in networkTimeout retries retryBackOffMs; do
            grep -q "^${key}=" "$properties" || {
              echo "Missing Gradle wrapper property: $key" >&2
              exit 1
            }
          done
          sed -i -E \
            -e 's#^distributionUrl=.*#distributionUrl=https\\://downloads.gradle.org/distributions/gradle-9.7.1-bin.zip#' \
            -e 's/^networkTimeout=.*/networkTimeout=120000/' \
            -e 's/^retries=.*/retries=5/' \
            -e 's/^retryBackOffMs=.*/retryBackOffMs=2000/' \
            "$properties"
          gradle_sha256="acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a"
          if grep -q '^distributionSha256Sum=' "$properties"; then
            sed -i "s/^distributionSha256Sum=.*/distributionSha256Sum=$gradle_sha256/" "$properties"
          else
            printf '\ndistributionSha256Sum=%s\n' "$gradle_sha256" >> "$properties"
          fi
          echo "Gradle wrapper download configuration:"
          grep -E '^(distributionUrl|distributionSha256Sum|networkTimeout|retries|retryBackOffMs)=' "$properties"

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEY" | base64 --decode > upstream/signingkey.jks
          chmod 600 upstream/signingkey.jks

      - name: Inspect WebDAV preference source
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find src/all/webdav/src -type f -name 'WebDav.kt' -print -quit)"
          test -n "$source_file"
          {
            echo "## WebDAV source: imports and preference setup"
            echo
            echo "File: `$source_file`"
            echo
            echo '~~~kotlin'
            nl -ba "$source_file" | sed -n '1,125p'
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build signed release APK
        id: build_release
        working-directory: upstream
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :src:all:webdav:assembleRelease
          mkdir -p repo/apk
          mapfile -t apks < <(find src/all/webdav/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do cp "$apk" "repo/apk/$(basename "$apk")"; done

      - name: Verify APK signing certificate
        working-directory: upstream
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY_FINGERPRINT: ${{ secrets.SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find repo/apk -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk" ]] || { echo "No release APK found in repo/apk" >&2; exit 1; }

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK path is not configured" >&2; exit 1; }
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          [[ -x "$apksigner" ]] || { echo "apksigner executable was not found" >&2; exit 1; }

          signer_output="$("$apksigner" verify --print-certs "$apk" 2>&1)" || {
            echo "apksigner failed to verify the generated APK:"
            echo "$signer_output"
            exit 1
          }

          # Android Build Tools versions use different labels:
          #   Signer #1 certificate SHA-256 digest: ...
          #   V2 Signer: certificate SHA-256 digest: ...
          actual="$(echo "$signer_output" | sed -nE 's/^(Signer #[0-9]+ |V[0-9]+ Signer: )?certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          expected="$(echo "$SIGNING_KEY_FINGERPRINT" | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          [[ -n "$actual" ]] || {
            echo "Could not extract the signer SHA-256 digest from apksigner output:"
            echo "$signer_output"
            exit 1
          }

          keystore_output="$(keytool -list -v -keystore signingkey.jks -alias "$ALIAS" -storepass "$KEY_STORE_PASSWORD" 2>&1)" || {
            echo "Could not inspect the temporary signing keystore:"
            echo "$keystore_output"
            exit 1
          }
          keystore_fp="$(echo "$keystore_output" | sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          [[ -n "$keystore_fp" ]] || {
            echo "Could not extract SHA-256 fingerprint from the signing keystore:"
            echo "$keystore_output"
            exit 1
          }

          echo "APK signer certificate SHA-256: $actual"
          echo "Keystore certificate SHA-256 : $keystore_fp"
          echo "Expected certificate SHA-256 : $expected"

          [[ "$keystore_fp" == "$expected" ]] || {
            echo "SIGNING_KEY_FINGERPRINT does not match the certificate in SIGNING_KEY." >&2
            exit 1
          }
          [[ "$actual" == "$keystore_fp" ]] || {
            echo "The APK was signed with a different certificate than the supplied signing keystore." >&2
            exit 1
          }

          echo "APK signing certificate verified successfully."

      - name: Generate extension metadata and legacy index
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          java -jar ./.github/scripts/Inspector.jar "repo/apk" "output.json" "tmp"
          python ./.github/scripts/create-repo.py

      - name: Generate AniZen Protobuf repository index
        env:
          SIGNING_KEY_FINGERPRINT: ${{ secrets.SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'protobuf==7.36.2'
          python scripts/generate-index-v2.py --repo-dir upstream/repo --owner "$GITHUB_REPOSITORY_OWNER" --repo "${GITHUB_REPOSITORY#*/}" --branch main --fingerprint "$SIGNING_KEY_FINGERPRINT"

      - name: Publish APKs and repository indices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk icon
          cp -a upstream/repo/apk/. apk/
          cp -a upstream/repo/icon/. icon/
          cp upstream/repo/index.json index.json
          cp upstream/repo/index.min.json index.min.json
          cp upstream/repo/index.pb index.pb
          cp upstream/repo/repo.json repo.json
          cp upstream/repo/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apk icon index.json index.min.json index.pb repo.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish WebDAV extension"
            git push origin HEAD:main
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webdav-extension-apk
          path: upstream/repo/apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SIGNING_VALIDATION_OUTCOME: ${{ steps.validate_signing.outcome }}
          BUILD_OUTCOME: ${{ steps.build_release.outcome }}
        run: |
          set -euo pipefail
          {
            echo "# AniZen WebDAV extension build"
            echo
            echo "- Overall job: **${JOB_STATUS}**"
            echo "- Signing-secret validation: **${SIGNING_VALIDATION_OUTCOME:-not run}**"
            echo "- Release APK build: **${BUILD_OUTCOME:-not run}**"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Module: \`src/all/webdav\`"
            echo "- Gradle: \`9.7.1\`"
            echo "- Distribution host: \`downloads.gradle.org\`"
            echo "- Distribution SHA-256: verified against the official Gradle checksum"
            echo "- Gradle distribution retries: **5**"
            echo "- Retry backoff: **2s, 4s, 8s, 16s, 32s**"
            echo
            echo "## Generated files"
            if compgen -G "upstream/repo/apk/*.apk" >/dev/null; then
              echo "- APK files:"
              while IFS= read -r apk; do
                echo "  - \`$(basename "$apk")\` ($(du -h "$apk" | cut -f1))"
              done < <(find upstream/repo/apk -maxdepth 1 -type f -name '*.apk' -print | sort)
            else
              echo "- APK: not generated"
            fi
            for file in index.json index.min.json index.pb repo.json; do
              if [[ -f "$file" ]]; then
                echo "- \`$file\`: generated in repository root"
              elif [[ -f "upstream/repo/$file" ]]; then
                echo "- \`$file\`: generated in upstream/repo (not yet published)"
              else
                echo "- \`$file\`: not generated"
              fi
            done
            if [[ "$JOB_STATUS" == "success" ]]; then
              echo
              echo "## AniZen repository URL"
              echo "\`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/repo.json\`"
            else
              echo
              echo "## Troubleshooting"
              echo "Open the failed step above for the exact error. If Gradle distribution download failed, the wrapper is configured to retry up to five times."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f upstream/signingkey.jks
