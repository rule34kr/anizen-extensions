name: Temporary WebDAV payload repack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-webdav-source.yml'
permissions:
  contents: write
jobs:
  repack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: main
      - name: Repack restored WebDAV source into distribution payload
        shell: bash
        run: |
          set -euo pipefail
          test -s recovered-source/src/eu/kanade/tachiyomi/animeextension/all/webdav/WebDav.kt
          test -s recovered-source/src/eu/kanade/tachiyomi/animeextension/all/webdav/NfoXml.kt
          mkdir -p "$RUNNER_TEMP/package/src/all"
          cp -a recovered-source "$RUNNER_TEMP/package/src/all/webdav"
          tar -cJf "$RUNNER_TEMP/webdav-core.tar.xz" -C "$RUNNER_TEMP/package" src/all/webdav
          base64 -w0 "$RUNNER_TEMP/webdav-core.tar.xz" > "$RUNNER_TEMP/webdav-core.b64"
          rm -f payload/webdav-core.part*.b64
          split -b 6000 -d -a 2 "$RUNNER_TEMP/webdav-core.b64" "$RUNNER_TEMP/part"
          index=1
          for part in "$RUNNER_TEMP"/part*; do
            printf -v target 'payload/webdav-core.part%d.b64' "$index"
            cp "$part" "$target"
            index=$((index + 1))
          done
          cat payload/webdav-core.part*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/verify.tar.xz"
          echo "$(sha256sum "$RUNNER_TEMP/webdav-core.tar.xz" | awk '{print $1}')  $RUNNER_TEMP/verify.tar.xz" | sha256sum -c -
          tar -tJf "$RUNNER_TEMP/verify.tar.xz" | grep -F 'src/all/webdav/src/eu/kanade/tachiyomi/animeextension/all/webdav/NfoXml.kt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add payload/
          git commit -m "Update WebDAV payload with direct browsing and NFO metadata"
          git push origin HEAD:main
