name: Temporary WebDAV source recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-webdav-source.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: main
      - name: Restore and publish temporary source tree
        shell: bash
        run: |
          set -euo pipefail
          cat payload/webdav-core.part*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/webdav-core.tar.xz"
          echo "d6d3106fe34e9aadf649e757a05a155fd8ba54afbbd226d347be63f31cb1d78c  $RUNNER_TEMP/webdav-core.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/webdav-core.tar.xz" -C "$GITHUB_WORKSPACE"
          test -f src/all/webdav/build.gradle
          rm -rf recovered-source
          mkdir -p recovered-source
          cp -a src/all/webdav/. recovered-source/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered-source/
          git commit -m "Temporarily expose restored WebDAV module for refactor"
          git push origin HEAD:main
