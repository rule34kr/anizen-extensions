name: Inspect current WebDAV source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-webdav-current.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: main
      - name: Restore and print current source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/webdav-core.part*.b64 | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/webdav.tar.xz"
          echo "9a5940c5b77efc16d6b39360a3c135fe02b0fc65ebf4b4a9f9e2ad845f7a9ce0  $RUNNER_TEMP/webdav.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/webdav.tar.xz" -C "$RUNNER_TEMP/source"
          for f in "$RUNNER_TEMP/source"/src/all/webdav/src/eu/kanade/tachiyomi/animeextension/all/webdav/*.kt; do
            echo "===== SOURCE FILE: $(basename "$f") =====" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
